apiVersion: v1
kind: Service
metadata:
  name: ingest-broker
  namespace: morphic-dev
spec:
  type: LoadBalancer
  ports:
    - name: http-ingest-broker
      protocol: TCP
      port: 80          # Exposing port 80 for HTTP
      targetPort: 5000   # Forward to your application on port 5000
    - name: https-ingest-broker
      protocol: TCP
      port: 443         # Exposing port 443 for HTTPS
      targetPort: 5000   # Forward to your application on port 5000
  selector:
    app: ingest-broker
